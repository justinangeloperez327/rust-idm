[package]
name = "rust-idm-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
build = "build.rs"

[dependencies]
download-core = { path = "../../crates/download-core" }
download-http = { path = "../../crates/download-http" }
download-storage = { path = "../../crates/download-storage" }
download-scheduler = { path = "../../crates/download-scheduler" }
slint = { version = "1.13", default-features = false, features = ["std", "backend-winit", "renderer-software", "compat-1-18"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
tokio-util = { version = "0.7", features = ["rt"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[build-dependencies]
slint-build = "1.13"

[lints]
workspace = true
